# Read the Docs build. Mirrors the docs job in .github/workflows/ci.yml:
# the web extra is needed because docs/api.rst autodocs lfast_etc.web.app.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - pandoc            # nbsphinx converts notebook markdown with it

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
        - web

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
