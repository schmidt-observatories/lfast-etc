[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfast-etc"
version = "0.1.3"
authors = [{ name = "Gudmundur Stefansson", email = "gstefansson@schmidtsciences.org" }]
description = "Exposure Time Calculator for the LFAST telescope array (WIYN Bench spectrograph and CSHELL)."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.10",
  "astropy>=5.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
web = ["flask>=3", "bokeh>=3.4"]
docs = [
  "sphinx>=7", "sphinx-rtd-theme>=2.0", "nbsphinx",
  "sphinx-copybutton", "myst-parser", "ipykernel",
]   # plus the pandoc binary on PATH
notebooks = ["pandas>=2.0", "jinja2>=3.0"]   # result tables in the example notebooks (pandas Styler needs jinja2)
dev = ["pytest", "nbformat", "nbclient", "ipykernel", "jupyter", "pandas>=2.0", "jinja2>=3.0"]

[project.scripts]
lfast-etc-web = "lfast_etc.web.app:main"

[project.urls]
Homepage = "https://github.com/schmidt-observatories/lfast-etc"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lfast_etc" = [
  "data/throughput/*.npy",
  "data/throughput/*.npz",
  "data/sky/*.fits",
  "data/config/*.toml",
  "data/*.mplstyle",
  "web/templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
