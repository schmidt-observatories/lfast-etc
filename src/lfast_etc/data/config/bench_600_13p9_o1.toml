# WIYN Bench spectrograph, 600 @ 13.9 grating, order 1, blaze peak 7500 A.
# Row of https://www.wiyn.org/Instruments/wiynbench.html; generated by
# scripts/build_bench_presets.py from the bench_r1800 anchor (see that script).
# Table coverage 2724 A, red-cable resolution 2.86 A at 2x2 binning.
[instrument]
name = "bench_600_13p9_o1"
description = "WIYN Bench, 600 @ 13.9 deg, order 1, 614-886 nm, R~2880"
wavelength_min_nm = 613.8
wavelength_max_nm = 886.2
resolving_power = 2875
pixels_per_resel = 2.2    # dispersion direction only, as bench_r1800
spectrograph_efficiency = 0.292  # grating peak efficiency 70% vs 72% for the 600 @ 10.1 anchor
slit_throughput = 1.0
qe = 0.75              # placeholder flat QE, as bench_r1800
dark_current = 3.0e-4  # e-/s/pix
read_noise = 3.7       # e-/pix
full_well = 100000.0   # placeholder
min_exptime = 1.0
