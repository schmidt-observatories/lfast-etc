# CSHELL with the 100 um slit. Slit throughput loss is TBD ("YY%" in the
# reference notebook); 0.5 is a placeholder -- update when measured.
[instrument]
name = "cshell_r43000"
description = "CSHELL, 100 um slit, R=43,000, 1.08-1.75 um (slit loss placeholder)"
wavelength_min_nm = 1080.0
wavelength_max_nm = 1750.0
resolving_power = 43000.0
