# CSHELL on LFAST: the former IRTF cryogenic echelle (Greene et al. 1993, SPIE 1946,
# copy in input/greene_1993.pdf; IRTF page https://irtfweb.ifa.hawaii.edu/~cshell/info.html).
# Detector numbers are the instrument's own and survive the move; the optical numbers
# (R per mode, slit loss, efficiency) depend on the LFAST fiber feed and are placeholders.
# CSHELL covers ~1.08-1.75 um on LFAST. One setting covers only ~2.5e-3 lambda
# (256 pixels at 2.7 km/s per pixel: 27 A at 1.08 um, 39 A at 1.555 um, 44 A at 1.75 um),
# so set wavelength limits to the window of interest.
# With the 100 um slit. Slit throughput loss is TBD ("YY%" in the reference notebook);
# 0.5 is a placeholder -- update when measured on the LFAST feed.
[instrument]
name = "cshell_r43000"
description = "CSHELL, 100 um slit, R=43,000, 1.08-1.75 um (slit loss placeholder)"
wavelength_min_nm = 1080.0
wavelength_max_nm = 1750.0
resolving_power = 43000.0
pixels_per_resel = 2.5    # dispersion direction only: the IRTF 0.5" slit value at R=43,000
spectrograph_efficiency = 0.1
slit_throughput = 0.5    # PLACEHOLDER
qe = 0.8               # placeholder flat QE
dark_current = 5.0     # e-/s/pix: IRTF "dark + background" below 2.5 um (was 0.5, the 1993 paper's
                       # dark alone for the NICMOS-3 array); the fiber-fed LFAST feed may do better
read_noise = 30.0      # e-/pix per read: IRTF quoted value for the 256x256 InSb (was 22, the 1993
                       # paper's multiple-sampling target); assumes Fowler sampling, reads >= 8 s
full_well = 80000.0    # placeholder
min_exptime = 8.0
free_spectral_range_frac = 2.5e-3
