# WIYN Bench spectrograph, sample moderate-resolution visible configuration.
# 600 lpm grating @ 10.1 deg, lambda_central = 5500 A, delta_lambda = 2763 A.
# Only 1-2 Bench configurations will be offered at the start of operations;
# the spectrograph cannot be reconfigured during the night. LFAST uses 1x1 binning.
# The other Bench modes (bench_*.toml) are generated from this one by
# scripts/build_bench_presets.py from the WIYN configuration table.
[instrument]
name = "bench_r1800"
description = "WIYN Bench, 600 @ 10.1 deg, order 1, 412-686 nm, R~1800 (reference notebook)"
wavelength_min_nm = 412.0
wavelength_max_nm = 686.0   # config spans to 688 nm; K_opt drops to ~5e-9 at 687 nm (O2 B band)
resolving_power = 1800.0
pixels_per_resel = 2.2    # dispersion direction only (reference notebook); x fiber-image height when known
spectrograph_efficiency = 0.3
slit_throughput = 1.0
qe = 0.75              # placeholder flat QE
dark_current = 3.0e-4  # e-/s/pix
# Detector: WIYN STA1 CCD (wiyn.org/Instruments/STA1vsT2KA.html), 18-bit ADC, three gain modes:
#   mode     e-/DN   read noise   ADC limit     binding limit
#   high     0.219   3.2 e-        57,400 e-    ADC (below the 63,000 e- 1% linearity point)
#   medium   0.438   3.7 e-       114,800 e-    full well 87,500 e-
#   low      0.876   4.3 e-       229,600 e-    full well 87,500 e-
# This preset assumes MEDIUM gain (read_noise 3.7, full_well 87,500). For high gain use
# Instrument.from_preset(..., read_noise=3.2, full_well=57400).
read_noise = 3.7       # e-/pix, STA1 medium gain
full_well = 87500.0    # e-/pix, STA1 full well (medium gain; 1% linearity to 63,000 e-)
min_exptime = 1.0
