# WIYN Bench spectrograph, 316 @ 63.4 grating, order 9, blaze peak 6563 A.
# Row of https://www.wiyn.org/Instruments/wiynbench.html; generated by
# scripts/build_bench_presets.py from the bench_r1800 anchor (see that script).
# Table coverage 250 A, red-cable resolution 0.23 A at 2x2 binning.
[instrument]
name = "bench_316_63p4_o9"
description = "WIYN Bench, 316 @ 63.4 deg, order 9, 644-669 nm, R~31280"
wavelength_min_nm = 643.8
wavelength_max_nm = 668.8
resolving_power = 31284
pixels_per_resel = 2.2    # dispersion direction only, as bench_r1800
spectrograph_efficiency = 0.208  # grating peak efficiency 50% vs 72% for the 600 @ 10.1 anchor
slit_throughput = 1.0
qe = 0.75              # placeholder flat QE, as bench_r1800
dark_current = 3.0e-4  # e-/s/pix
read_noise = 3.7       # e-/pix
full_well = 100000.0   # placeholder
min_exptime = 1.0
