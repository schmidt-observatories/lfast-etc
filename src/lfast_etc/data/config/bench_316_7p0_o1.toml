# WIYN Bench spectrograph, 316 @ 7.0 grating, order 1, blaze peak 7500 A.
# Row of https://www.wiyn.org/Instruments/wiynbench.html; generated by
# scripts/build_bench_presets.py from the bench_r1800 anchor (see that script).
# Table coverage 5290 A, red-cable resolution 5.72 A at 2x2 binning.
[instrument]
name = "bench_316_7p0_o1"
description = "WIYN Bench, 316 @ 7.0 deg, order 1, 486-1014 nm, R~1440"
wavelength_min_nm = 485.5
wavelength_max_nm = 1014.5
resolving_power = 1438
pixels_per_resel = 2.2    # dispersion direction only, as bench_r1800
spectrograph_efficiency = 0.292  # grating peak efficiency 70% vs 72% for the 600 @ 10.1 anchor
slit_throughput = 1.0
qe = 0.75              # placeholder flat QE, as bench_r1800
dark_current = 3.0e-4  # e-/s/pix
read_noise = 3.7       # e-/pix
full_well = 87500.0    # e-/pix: WIYN STA1 CCD (1% linearity to 63,000 e-; wiyn.org/Instruments/STA1vsT2KA.html)
min_exptime = 1.0
