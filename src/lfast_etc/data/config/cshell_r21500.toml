# CSHELL on LFAST: the former IRTF cryogenic echelle (Greene et al. 1993, SPIE 1946,
# copy in input/greene_1993.pdf; IRTF page https://irtfweb.ifa.hawaii.edu/~cshell/info.html).
# Detector numbers are the instrument's own and survive the move; the optical numbers
# (R per mode, slit loss, efficiency) depend on the LFAST fiber feed and are placeholders.
# CSHELL covers ~1.08-1.75 um on LFAST. One setting covers only ~2.5e-3 lambda
# (256 pixels at 2.7 km/s per pixel: 27 A at 1.08 um, 39 A at 1.555 um, 44 A at 1.75 um),
# so set wavelength limits to the window of interest.
# With the 200 um slit. Slit throughput loss is TBD ("XX%" in the reference notebook);
# 0.75 is a placeholder -- update when measured on the LFAST feed.
[instrument]
name = "cshell_r21500"
description = "CSHELL, 200 um slit, R=21,500, 1.08-1.75 um (slit loss placeholder)"
wavelength_min_nm = 1080.0
wavelength_max_nm = 1750.0
resolving_power = 21500.0
pixels_per_resel = 5.0    # dispersion direction only: 2.5 px at R=43,000 x 43,000/21,500 (IRTF 1" slit value)
fiber_image_px = 6.0      # spatial height: the slit narrows the dispersion direction only (native fiber image, cshell_r18000)
spectrograph_efficiency = 0.1
slit_throughput = 0.75   # PLACEHOLDER
qe = 0.8               # flat; ~80% for 1-3 um (Brown et al. 2026, Table 1)
dark_current = 0.5     # e-/s/pix: Hughes 256x256 SBRC InSb at 30 K, IRTF measurement (Brown et al. 2026,
                       # SPIE 14149, Table 1; input/literature/141499Z.pdf). The IRTF page's 5 e-/s was the
                       # K-band background through the IRTF (100 ADU in 240 s at 11 e-/ADU), not the detector.
read_noise = 22.0      # e-/pix per read at 6 Fowler samples; 55 e- single-sample, ~19 e- at the default
                       # 8 samples (Brown et al. 2026, Table 1). The IRTF page's ~30 e- is a sensitivity-
                       # formula value with no sampling mode stated.
full_well = 55000.0    # e-/pix, "1% linear" well at the default -325 mV bias; 92,400 / 170,000 / 234,000 e- at
                       # -500 / -800 / -1000 mV (Brown et al. 2026, Table 1)
min_exptime = 8.0      # reference notebook: time for the 8-sample Fowler read; single sample >= 76 ms
free_spectral_range_frac = 2.5e-3
