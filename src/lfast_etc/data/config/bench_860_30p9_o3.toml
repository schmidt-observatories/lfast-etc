# WIYN Bench spectrograph, 860 @ 30.9 grating, order 3, blaze peak 4000 A.
# Row of https://www.wiyn.org/Instruments/wiynbench.html; generated by
# scripts/build_bench_presets.py from the bench_r1800 anchor (see that script).
# Table coverage 560 A, red-cable resolution 0.52 A at 2x2 binning.
[instrument]
name = "bench_860_30p9_o3"
description = "WIYN Bench, 860 @ 30.9 deg, order 3, 400-428 nm, R~8430 (clipped at 400 nm)"
wavelength_min_nm = 400.0
wavelength_max_nm = 428.0
resolving_power = 8434
pixels_per_resel = 2.2    # dispersion direction only, as bench_r1800
spectrograph_efficiency = 0.271  # grating peak efficiency 65% vs 72% for the 600 @ 10.1 anchor
slit_throughput = 1.0
qe = 0.75              # placeholder flat QE, as bench_r1800
dark_current = 3.0e-4  # e-/s/pix
read_noise = 3.7       # e-/pix
full_well = 87500.0    # e-/pix: WIYN STA1 CCD (1% linearity to 63,000 e-; wiyn.org/Instruments/STA1vsT2KA.html)
min_exptime = 1.0
