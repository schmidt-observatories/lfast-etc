# WIYN Bench spectrograph, 740 VPH grating, order 2, blaze peak 5000 A.
# Row of https://www.wiyn.org/Instruments/wiynbench.html; generated by
# scripts/build_bench_presets.py from the bench_r1800 anchor (see that script).
# Table coverage 1076 A, red-cable resolution 1.34 A at 2x2 binning.
[instrument]
name = "bench_740vph_o2"
description = "WIYN Bench, 740 VPH, order 2, 446-554 nm, R~4090"
wavelength_min_nm = 446.2
wavelength_max_nm = 553.8
resolving_power = 4091
pixels_per_resel = 2.2    # dispersion direction only, as bench_r1800
spectrograph_efficiency = 0.300  # no peak efficiency listed for the VPH gratings: anchor value kept
slit_throughput = 1.0
qe = 0.75              # placeholder flat QE, as bench_r1800
dark_current = 3.0e-4  # e-/s/pix
read_noise = 3.7       # e-/pix
full_well = 100000.0   # placeholder
min_exptime = 1.0
