# WIYN Bench spectrograph, 860 @ 30.9 grating, order 2, blaze peak 6000 A.
# Row of https://www.wiyn.org/Instruments/wiynbench.html; generated by
# scripts/build_bench_presets.py from the bench_r1800 anchor (see that script).
# Table coverage 840 A, red-cable resolution 0.77 A at 2x2 binning.
[instrument]
name = "bench_860_30p9_o2"
description = "WIYN Bench, 860 @ 30.9 deg, order 2, 558-642 nm, R~8540"
wavelength_min_nm = 558.0
wavelength_max_nm = 642.0
resolving_power = 8543
pixels_per_resel = 2.2    # dispersion direction only, as bench_r1800
spectrograph_efficiency = 0.271  # grating peak efficiency 65% vs 72% for the 600 @ 10.1 anchor
slit_throughput = 1.0
qe = 0.75              # placeholder flat QE, as bench_r1800
dark_current = 3.0e-4  # e-/s/pix
read_noise = 3.7       # e-/pix
full_well = 100000.0   # placeholder
min_exptime = 1.0
