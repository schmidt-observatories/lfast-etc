# WIYN Bench spectrograph, 1200 @ 28.7 grating, order 1, blaze peak 7500 A.
# Row of https://www.wiyn.org/Instruments/wiynbench.html; generated by
# scripts/build_bench_presets.py from the bench_r1800 anchor (see that script).
# Table coverage 1231 A, red-cable resolution 1.19 A at 2x2 binning.
[instrument]
name = "bench_1200_28p7_o1"
description = "WIYN Bench, 1200 @ 28.7 deg, order 1, 688-812 nm, R~6910"
wavelength_min_nm = 688.5
wavelength_max_nm = 811.5
resolving_power = 6910
pixels_per_resel = 2.2    # dispersion direction only, as bench_r1800
spectrograph_efficiency = 0.229  # grating peak efficiency 55% vs 72% for the 600 @ 10.1 anchor
slit_throughput = 1.0
qe = 0.75              # placeholder flat QE, as bench_r1800
dark_current = 3.0e-4  # e-/s/pix
read_noise = 3.7       # e-/pix
full_well = 100000.0   # placeholder
min_exptime = 1.0
